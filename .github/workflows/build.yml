name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM and Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm ninja-build

      - name: Install NASM and Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm ninja -y

      - name: Configure
        run: cmake --preset ninja

      - name: Build all programs
        run: cmake --build --preset ninja
